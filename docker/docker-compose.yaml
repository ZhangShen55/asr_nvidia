services:
  asr-offline:
    image: ${ASR_IMAGE:?请设置 ASR_IMAGE，例如 asr_offline:v3_20261117120000}
    container_name: ${ASR_CONTAINER_NAME:-asr-offline-v3}
    restart: "no"
    init: true
    runtime: ascend
    privileged: true
    ipc: host
    environment:
      CONFIG_PATH: /config.toml
      ASR_DEPLOYMENT_PROFILE: npu-910b
      ASR_RUNTIME_DIR: /tmp/asr-offline
      ASR_STATS_PATH: /tmp/asr-offline/asr_stats.json
      ASCEND_VISIBLE_DEVICES: ${ASCEND_VISIBLE_DEVICES:-7}
    volumes:
      - ${ASR_CONFIG:-./config.toml}:/config.toml:ro
      - ${QWEN_MODEL_DIR:?请设置本地Qwen权重目录}:/app/qwen-model:ro
      - /usr/local/Ascend/driver:/usr/local/Ascend/driver:ro
      - /usr/local/dcmi:/usr/local/dcmi:ro
      - /usr/local/bin/npu-smi:/usr/local/bin/npu-smi:ro
      - /etc/ascend_install.info:/etc/ascend_install.info:ro
    ports:
      - "${ASR_PORT:-9000}:9000"
    stop_grace_period: 180s
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:9000/get_status >/dev/null"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 3

# 昇腾 910B Docker v3 运行配置（模型随镜像交付，运行参数建议通过卷挂载覆盖）

# 容器内并行运行的完整 ASR 服务进程数量。
# 每个实例各自持有一份本地模型权重，实例数即HBM占用倍数，默认单实例。
instance_count = 1

# 日志保留策略：按天切分 + 单文件大小上限，超期的历史日志自动删除
[log]
log_path = "/tmp/asr-offline/asr_service.log"
max_days = 7
max_size_mb = 100

# 模型路径配置（模型随镜像打包到 /app/model，只包含 v3 链路需要的三个模型）
[status]
# GET按需刷新资源缓存的最短间隔；无查询不采样，0.1～60秒，修改后重启。
resource_sample_interval_s = 1.0

[model_paths]
vad_model_dir = "/app/model/speech_fsmn_vad_zh-cn-16k-common-pytorch"
spk_model_dir = "/app/model/speech_campplus_sv_zh_en_16k-common_advanced"
emotion_model_dir = "/app/model/emotion2vec_plus_large"

# 语速计算配置
[speech_rate]
rate_factor = 0.4

# 功能开关配置：v3 链路的说话人与情绪能力互相独立
[features]
open_v2_role = true      # CAM++ 说话人嵌入
open_v2_emotion = true   # emotion2vec 情绪

# WeTextProcessing 1.2.0 ITN 配置。规则只规范化文本，不改变时间轴或 ASR 语义。
[itn]
enabled = true
enable_standalone_number = true
enable_0_to_9 = false
remove_interjections = true
failure_mode = "passthrough"

# Qwen3-ASR 适配链路（/v3/seacraft_asr）
[qwen_asr]
# true在就绪前加载全部Qwen权重/processor并常驻；不执行语音暖身，修改后重启。
preload_on_startup = false            # 保留原根配置行为；128预加载见test/config.qwen128.toml
execution_mode = "thread"             # thread兼容缺省；process为单HF模型worker，待审核后显式选择
process_shutdown_grace_s = 30          # 只在显式关闭后等待；不改120秒推理timeout，不到grace不kill
enabled = true
model = ""  # 仅作本地模型标识，不发模型发现请求
local_model_dir = "/app/qwen-model" # 从宿主只读挂载提供
local_device = "npu:0" # 物理7号卡只映射一张时，容器内从0重新编号
local_dtype = "bfloat16"
local_instance_count = 1
max_new_tokens = 256
segment_concurrency = 1 # 完整课堂对照选择：native单Qwen副本、双门限1/1
request_concurrency = 1 # 全局逻辑段上限；保留单Qwen副本，完整课堂证据见迁移报告
audio_concurrency = 8                   # A+B 同时处理的音频总数
audio_spk_emo_concurrency = 4           # B 类音频上限（请求说话人、情绪或角色识别）
queue_max_size = 64                     # A+B 共享等待队列容量
queue_wait_timeout_s = 0                # 0 = 队列满立即拒绝；>0 才排队等待
request_timeout_s = 120                 # 单次 Qwen 请求超时
retry_count = 1                         # Qwen 请求失败重试次数
speaker_similarity_threshold = 0.3       # CAM++ 说话人聚类余弦相似度阈值（实测 sweep 取值）

[vad]
# 保留既有nested kwargs传递方式，不把声明值误当实际FSMN选项。
# 本次权重model_conf实际为：单段8000ms、结束静音800ms、speech_noise=0.6、
# 全局decibel=-100、全局snr=-100；下列12000/0.8/-40/18未覆盖这些构造值。
# 服务段级SNR18、独立segment_decibel=-40与RMS过滤另行真实生效。
# 详见docs/npu-910b-migration-20261117/classroom-threshold-review.md。
# 每个元素对应一个独立 FSMN-VAD worker；数组长度决定完整音频 VAD 并发上限
vad_device = ["cpu", "cpu", "npu:0", "npu:0"] # 设备配比待实测；ASCEND_VISIBLE_DEVICES使用宿主物理编号
# 小于该时长的候选段直接丢弃，单位：秒
min_segment_duration_s = 0.3
# 历史nested传入值，单位毫秒；实际选项见上方说明
vad_max_single_segment_time_ms = 12000
vad_max_end_silence_time_ms = 800
# 历史nested语音/噪声声明；当前模型有效值为0.6，不能据此声称已应用0.8
vad_speech_noise_thres = 0.8
# 历史全局帧级log能量声明，非dBFS；当前FSMN实际仍为模型配置-100
vad_decibel_thres = -40.0
# 独立服务段级log能量阈值，非dBFS；不等于上方FSMN全局选项
vad_snr_thres = 18.0
# 段级 decibel 过滤：抽取帧中低能量比例达到 0.8 时删除该段
vad_decibel_thres_filter_enabled = true
vad_segment_decibel_thres = -40.0
vad_decibel_frame_sample_ratio = 0.5
vad_decibel_low_frame_ratio_thres = 0.8
# 段级 SNR 过滤；对齐本轮现行宿主配置18.0，非新增调参
vad_snr_thres_filter_enabled = true
# 段级 RMS dBFS 过滤
vad_low_volume_rms_dbfs_thres = -40.0
vad_low_volume_filter_enabled = true
# 段级过滤范围，单位：分钟；0=整段，-1=该侧不限制
after_start = 3
before_end = 3

# 复读（生成幻觉循环）后处理。Qwen 偶尔会在某个 VAD 段上进入
# 「同一短语无限重复」的循环，直到撞上 max_model_len 被截断（实测产出
# 1863 字符的复读串）。这里按语速上限判定异常长度，再折叠重复部分。
# 标定依据（68,018 段真实样本）：正常段 p99.9 = 20.3 字符/秒、峰值 26.2；
# 复读段 282~313。取 40 留约 1.5 倍余量且远低于复读量级。
repetition_guard_enabled = true          # 是否启用复读检测与修复
repetition_max_chars_per_second = 40     # 按段时长估算合理字符数的上限系数
repetition_min_chars = 120               # 判定长度异常的绝对下限字符数
repetition_min_unit = 4                  # 判定为循环的重复子串最小长度
repetition_min_times = 3                 # 判定为循环的最小连续重复次数

[model_device_pool]
speech_campplus_execution_mode = "thread" # 兼容安全缺省；process候选须完整矩阵/保护验收后选用
speech_campplus_process_startup_timeout_s = 60 # 每worker READY启动期限；有限正数且不超过300秒
speech_campplus_process_shutdown_grace_s = 30 # 仅显式关闭；不将普通请求取消改为kill
speech_campplus_devices = ["npu:0","npu:0","npu:0"]
emotion2vec_devices = ["npu:0"]

# 官方nginx:1.31.10-alpine，arm64；server_tokens隐藏版本号，不承诺不存在未知漏洞。
# 不启用TLS/HTTP2/HTTP3/mail/stream，避免引入本次部署不需要的监听与模块配置。
worker_processes 2;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
worker_shutdown_timeout 600s;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    log_format upstream_timing '$remote_addr [$time_local] "$request" $status '
                               'rt=$request_time upstream=$upstream_addr '
                               'ustatus=$upstream_status urt=$upstream_response_time';
    access_log /dev/stdout upstream_timing;
    sendfile on;
    keepalive_timeout 30s;
    client_header_timeout 30s;
    client_body_timeout 600s;
    send_timeout 600s;
    # 长WAV上传不设1MiB缺省限制；仍应由调用方控制文件大小。
    client_max_body_size 0;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    # Docker内置DNS；resolve使后端重建换IP后无需重启代理。
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;
    upstream asr_pool {
        zone asr_pool 64k;
        least_conn;
        server asr-npu0:9000 resolve max_fails=1 fail_timeout=10s;
        server asr-npu1:9000 resolve max_fails=1 fail_timeout=10s;
        server asr-npu5:9000 resolve max_fails=1 fail_timeout=10s;
        server asr-npu6:9000 resolve max_fails=1 fail_timeout=10s;
        server asr-npu7:9000 resolve max_fails=1 fail_timeout=10s;
        keepalive 32;
    }
    server {
        listen 8080;
        server_name _;
        location = /nginx-health {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }
        # /get_status及/clear_tasks_list同样只到一个后端，不是集群汇总/广播。
        location / {
            proxy_pass http://asr_pool;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_hide_header Server;
            proxy_hide_header X-Powered-By;
            proxy_connect_timeout 10s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;
            proxy_request_buffering off;
            proxy_buffering off;
            # 不自动重放已提交的推理POST，也不把应用4013偷偷换后端重试。
            proxy_next_upstream off;
        }
    }
}

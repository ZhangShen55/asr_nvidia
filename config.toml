instance_count = 1

[log]
log_path = "./asr_service.log"
max_days = 7
max_size_mb = 100

[model_paths]
vad_model_dir = "./model/speech_fsmn_vad_zh-cn-16k-common-pytorch"
spk_model_dir = "./model/speech_campplus_sv_zh_en_16k-common_advanced"
emotion_model_dir = "./model/emotion2vec_plus_large"

[speech_rate]
rate_factor = 0.4  # 语速修正系数（数值偏高时下调），最终语速 = 原始字/分钟 * rate_factor

[itn]
enabled = true
enable_standalone_number = true
enable_0_to_9 = false
remove_interjections = true
failure_mode = "passthrough"

[qwen_asr]
enabled = true
base_url = "http://qwen3-asr:8000"      # Qwen3-ASR 服务地址（IP + 端口）
model = ""                              # 留空表示从 /v1/models 自动发现
segment_concurrency = 15                # 单个音频内同时发往 Qwen 的 VAD 段请求数
request_concurrency = 120               # 所有音频合计同时发往 Qwen 的请求数
audio_concurrency = 8                   # A+B 同时处理的音频总数
audio_spk_emo_concurrency = 4           # B 类音频上限（请求说话人、情绪或角色识别）
queue_max_size = 64                     # A+B 共享等待队列容量
queue_wait_timeout_s = 0                # 0 = 队列满立即拒绝；>0 才排队等待
request_timeout_s = 120                 # 单次 Qwen 请求超时
connect_timeout_s = 10                  # Qwen 服务连接超时
retry_count = 2                         # Qwen 请求失败重试次数
speaker_similarity_threshold = 0.3       # CAM++ 说话人聚类余弦相似度阈值（实测 sweep 取值）

[vad]
# 每个元素对应一个独立 FSMN-VAD worker；数组长度决定完整音频 VAD 并发上限
vad_device = ["cpu", "cpu", "cuda:0", "cuda:0"]
# 小于该时长的候选段直接丢弃，单位：秒
min_segment_duration_s = 0.3
# FunASR 单段上限与结束静音，单位：毫秒
vad_max_single_segment_time_ms = 12000
vad_max_end_silence_time_ms = 800
# VAD 语音/噪声阈值：0.3 偏灵敏，0.6 正常，0.8 偏不敏感；重启生效
vad_speech_noise_thres = 0.8

vad_snr_thres = 18.0 # 段级 SNR 过滤；18.0
vad_snr_thres_filter_enabled = true

# FunASR 全局帧级 log 能量阈值，不是 dBFS；-100 表示保持原行为
vad_decibel_thres = -40.0
# FunASR 全局帧级 SNR 阈值；-100 表示保持原行为
vad_segment_decibel_thres = -40.0
vad_decibel_frame_sample_ratio = 0.5 # 每秒采取帧率
vad_decibel_low_frame_ratio_thres = 0.8 # 段级 decibel 过滤：抽取帧中低能量比例达到 0.8 时删除该段
vad_decibel_thres_filter_enabled = true

# 段级 RMS dBFS 过滤
vad_low_volume_rms_dbfs_thres = -40.0
vad_low_volume_filter_enabled = true

# 段级过滤窗口，单位：分钟；0=整段都参与过滤，-1=该侧不限制
# 3/3：只有落在开头 3 分钟、结尾 3 分钟内的段才做低音量/SNR/RMS 过滤；
# 窗口外的中间段无条件保留，避免误删讲授主体。改动需重启生效。
after_start = 3
before_end = 3

# 复读（生成幻觉循环）后处理。Qwen 偶尔会在某个 VAD 段上进入
# 「同一短语无限重复」的循环，直到撞上 max_model_len 被截断（实测产出
# 1863 字符的复读串）。这里按语速上限判定异常长度，再折叠重复部分。
# 标定依据（68,018 段真实样本）：正常段 p99.9 = 20.3 字符/秒、峰值 26.2；
# 复读段 282~313。取 40 留约 1.5 倍余量且远低于复读量级。
repetition_guard_enabled = true          # 是否启用复读检测与修复
repetition_max_chars_per_second = 40     # 按段时长估算合理字符数的上限系数
repetition_min_chars = 120               # 判定长度异常的绝对下限字符数
repetition_min_unit = 4                  # 判定为循环的重复子串最小长度
repetition_min_times = 3                 # 判定为循环的最小连续重复次数

# 功能开关配置：v3 链路的说话人与情绪能力互相独立
[features]
open_v2_role = true      # CAM++ 说话人嵌入
open_v2_emotion = true   # emotion2vec 情绪

[model_device_pool]
speech_campplus_devices = ["cuda:0","cuda:0","cuda:0"]  # 每个元素对应一个 CAM++ 实例
emotion2vec_devices = ["cuda:0"]      # 每个元素对应一个 emotion2vec 实例
speech_campplus_use_tensorrt = true       # 仅 CUDA 实例生效；修改后重启
speech_campplus_tensorrt_precision = "fp16" # fp16 / fp32，选择对应 engine
emotion2vec_use_tensorrt = true
emotion2vec_tensorrt_precision = "fp16"